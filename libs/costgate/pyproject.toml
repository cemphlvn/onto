[project]
name = "costgate"
version = "0.1.0"
description = "Calibrate a classifier's confidence and decide by cost: act on a prediction, or ask a person"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
