[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onto-template-opt"
version = "0.1.0"
description = "Evidence-gated optimization of reusable text templates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Cem Pehlivan"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

