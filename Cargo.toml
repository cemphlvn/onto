[workspace]
resolver = "3"
members = [
    "crates/onto-core",
    "crates/onto-models",
    "crates/onto-remote",
    "crates/onto-local",
    "crates/onto-runtime",
    "crates/onto-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cemphlvn/onto"

[workspace.dependencies]
onto-core = { path = "crates/onto-core" }
onto-models = { path = "crates/onto-models" }
onto-remote = { path = "crates/onto-remote" }
onto-local = { path = "crates/onto-local", default-features = false }
onto-runtime = { path = "crates/onto-runtime" }
egg = { version = "0.11.0", features = ["deterministic"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
memory-stats = "1.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", default-features = false }
web-time = "1.1"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "fmt", "env-filter"] }
