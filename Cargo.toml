[workspace]
resolver = "3"
members = ["crates/onto-core", "crates/onto-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cemphlvn/onto"

[workspace.dependencies]
onto-core = { path = "crates/onto-core" }
egg = { version = "0.11.0", features = ["deterministic"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
