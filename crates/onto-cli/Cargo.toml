[package]
name = "onto-cli"
description = "Command-line navigator for onto categories"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "onto"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap.workspace = true
ed25519-dalek = "2.2"
getrandom = "0.3"
onto-core = { workspace = true, features = ["serde"] }
onto-local = { workspace = true, optional = true, default-features = false }
onto-remote.workspace = true
onto-runtime.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
# Local judges through llama.cpp (needs cmake and a C++ toolchain).
local = ["dep:onto-local", "onto-local/llama"]
local-metal = ["local", "onto-local/metal"]
local-cuda = ["local", "onto-local/cuda"]
local-vulkan = ["local", "onto-local/vulkan"]
